# XcodeGen spec — generates the Xcode project that builds the real .app bundles.
#
#   brew install xcodegen      # one-time
#   xcodegen generate          # creates Translatis.xcodeproj
#   open Translatis.xcodeproj  # pick the TranslatisMac or TranslatisiOS scheme, then Run
#
# The App targets link the Swift Package products in this repo. The iOS app links
# ONLY the chat subset (no Tools / Permission / AgentKernel / Cowork).

name: Translatis

options:
  bundleIdPrefix: com.Vita0818
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  localPackagesGroup: "Internal Modules"
  postGenCommand: "sh scripts/hide-xcode-package-schemes.sh"

packages:
  Intatis:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.72"
    CURRENT_PROJECT_VERSION: "72"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: "NO"
    # To run on a device or archive for distribution, set your team:
    # DEVELOPMENT_TEAM: ABCDE12345

targets:

  # ---- macOS DeveloperID app: Chat / Code / Cowork + stdio/HTTP MCP client ----
  TranslatisMac:
    type: application
    platform: macOS
    sources:
      - Apps/TranslatisMac/Sources
      - Apps/TranslatisMac/Resources
      - path: Translatis.icon
        buildPhase: resources
      - path: Apps/SharedResources
        buildPhase: resources
      - path: NOTICE.md
        buildPhase: resources
      - path: ThirdPartyNotices
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Vita0818.TranslatisMac
        # Let Xcode synthesize Info.plist (injects CFBundleExecutable etc.).
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Translatis
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Translatis contributors. See NOTICE.md."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Translatis uses the microphone to turn voice into editable message drafts."
        ASSETCATALOG_COMPILER_APPICON_NAME: Translatis
        CODE_SIGN_ENTITLEMENTS: Apps/TranslatisMac/TranslatisMac.DeveloperID.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: "YES"
    dependencies:
      - package: Intatis
        product: IntatisCore
      - package: Intatis
        product: IntatisProtocol
      - package: Intatis
        product: IntatisProviders
      - package: Intatis
        product: IntatisConversation
      - package: Intatis
        product: IntatisArtifacts
      - package: Intatis
        product: IntatisMultimodal
      - package: Intatis
        product: IntatisSharedUI
      - package: Intatis
        product: IntatisTools
      - package: Intatis
        product: IntatisKnowledge
      - package: Intatis
        product: IntatisPermission
      - package: Intatis
        product: IntatisAgentKernel
      - package: Intatis
        product: IntatisSkills
      - package: Intatis
        product: IntatisCowork
      - package: Intatis
        product: IntatisMCP
      - package: Intatis
        product: IntatisMCPStdio
      - package: Intatis
        product: IntatisCodexRuntime
      - package: Intatis
        product: IntatisCoworkUI

  # ---- iOS app: chat-only SUBSET (deliberately no workspace stack) ----
  TranslatisiOS:
    type: application
    platform: iOS
    sources:
      - Apps/TranslatisiOS/Sources
      - Apps/TranslatisiOS/Resources
      - path: Translatis.icon
        buildPhase: resources
      - path: Apps/SharedResources
        buildPhase: resources
      - path: NOTICE.md
        buildPhase: resources
      - path: ThirdPartyNotices
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Vita0818.Translatis
        TARGETED_DEVICE_FAMILY: "1,2"
        # Let Xcode synthesize Info.plist (injects CFBundleExecutable etc.).
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Translatis
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Translatis uses the microphone for voice input transcription."
        ASSETCATALOG_COMPILER_APPICON_NAME: Translatis
    dependencies:
      - package: Intatis
        product: IntatisCore
      - package: Intatis
        product: IntatisProtocol
      - package: Intatis
        product: IntatisProviders
      - package: Intatis
        product: IntatisConversation
      - package: Intatis
        product: IntatisArtifacts
      - package: Intatis
        product: IntatisMultimodal
      - package: Intatis
        product: IntatisSharedUI

schemes:
  TranslatisMac:
    build:
      targets:
        TranslatisMac: all
    run:
      config: Debug
    management:
      shared: true
      orderHint: 0
      isShown: true

  TranslatisiOS:
    build:
      targets:
        TranslatisiOS: all
    run:
      config: Debug
    management:
      shared: true
      orderHint: 1
      isShown: true
